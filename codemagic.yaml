workflows:
  ios-secoto:
    name: SECOTO iOS — Xcode 26 / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SECOTO_ASC
    environment:
      groups:
        - secoto_shared
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.secoto.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6794878696"
        IOS_MARKETING_VERSION: "1.3"
      node: 24
      xcode: 26.0
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Dépendances reproductibles
        script: npm ci
      - name: Verify SECOTO configuration
        script: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$VITE_SECOTO_FUNCTIONS_BASE_URL"
          test -n "$VITE_APPLE_PAY_MERCHANT_ID"

          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL invalid"; exit 1 ;;
          esac

          case "$VITE_SUPABASE_ANON_KEY" in
            sb_publishable_*|eyJ*) ;;
            *) echo "VITE_SUPABASE_ANON_KEY invalid"; exit 1 ;;
          esac

          case "$VITE_SECOTO_FUNCTIONS_BASE_URL" in
            https://*/.netlify/functions) ;;
            *) echo "VITE_SECOTO_FUNCTIONS_BASE_URL invalid"; exit 1 ;;
          esac

          if [ "$VITE_APPLE_PAY_MERCHANT_ID" != "merchant.fr.secoto.app" ]; then
            echo "VITE_APPLE_PAY_MERCHANT_ID invalid"; exit 1
          fi

      - name: Lint, tests et build Web
        script: |
          npm run lint
          npm test
          npm run build
      - name: Son de notification natif — génération et contrôle iOS
        script: |
          # Le WAV est versionné dans le dépôt ; on le régénère et on exige
          # qu'il soit IDENTIQUE. Le générateur est déterministe : une
          # différence signifie que le fichier committé n'est plus le reflet
          # de sa source, et le build doit s'arrêter là.
          cp ios/App/App/secoto_cash_register.wav /tmp/secoto_sound_committed.wav
          npm run sounds
          cmp /tmp/secoto_sound_committed.wav ios/App/App/secoto_cash_register.wav

          # Contraintes APNs : PCM linéaire, 30 secondes maximum.
          python3 - <<'PY'
          import sys, wave
          with wave.open("ios/App/App/secoto_cash_register.wav") as w:
              seconds = w.getnframes() / w.getframerate()
              assert w.getcomptype() == "NONE", "APNs exige du PCM lineaire"
              assert w.getsampwidth() == 2, "16 bits attendus"
              assert seconds <= 30, f"APNs refuse un son de {seconds:.1f}s"
              print(f"son de caisse : {seconds:.2f}s, PCM {w.getsampwidth()*8} bits, OK")
          PY

          # Référencé dans le projet Xcode, sinon il n'entre pas dans le bundle
          # et iOS retombe silencieusement sur le son par défaut.
          grep -q "secoto_cash_register.wav in Resources" "$XCODE_PROJECT/project.pbxproj"
      - name: Synchronisation Capacitor iOS (Swift Package Manager)
        script: |
          npx cap sync ios
          test -f "$XCODE_PROJECT/project.pbxproj"
          test ! -f ios/App/Podfile
          test -f ios/App/App/PrivacyInfo.xcprivacy
          test -f ios/App/App/App.entitlements
          test -f ios/App/App/secoto_cash_register.wav
          grep -q "merchant.fr.secoto.app" ios/App/App/App.entitlements
      - name: Résolution Swift Package Manager
        script: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Compilation simulateur sans signature
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Numéro de build App Store
        script: |
          APP_STORE_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" --platform=IOS 2>/dev/null || echo 0)
          TESTFLIGHT_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --platform=IOS 2>/dev/null || echo 0)
          PROJECT_SEQUENCE=${PROJECT_BUILD_NUMBER:-0}

          case "$APP_STORE_BUILD_NUMBER" in
            ''|*[!0-9]*) APP_STORE_BUILD_NUMBER=0 ;;
          esac
          case "$TESTFLIGHT_BUILD_NUMBER" in
            ''|*[!0-9]*) TESTFLIGHT_BUILD_NUMBER=0 ;;
          esac
          case "$PROJECT_SEQUENCE" in
            ''|*[!0-9]*) PROJECT_SEQUENCE=0 ;;
          esac

          LATEST_UPLOADED_BUILD=$APP_STORE_BUILD_NUMBER
          if [ "$TESTFLIGHT_BUILD_NUMBER" -gt "$LATEST_UPLOADED_BUILD" ]; then
            LATEST_UPLOADED_BUILD=$TESTFLIGHT_BUILD_NUMBER
          fi

          IOS_BUILD_NUMBER=$((LATEST_UPLOADED_BUILD + 1))

          # La séquence Codemagic protège aussi contre un délai de mise à jour
          # de l'API App Store Connect après un upload récent.
          if [ "$PROJECT_SEQUENCE" -gt "$IOS_BUILD_NUMBER" ]; then
            IOS_BUILD_NUMBER=$PROJECT_SEQUENCE
          fi

          # Le build 20 existe déjà dans App Store Connect.
          if [ "$IOS_BUILD_NUMBER" -lt 21 ]; then
            IOS_BUILD_NUMBER=21
          fi

          echo "App Store build : $APP_STORE_BUILD_NUMBER"
          echo "TestFlight build : $TESTFLIGHT_BUILD_NUMBER"
          echo "Codemagic project build : $PROJECT_SEQUENCE"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "SECOTO $IOS_MARKETING_VERSION ($IOS_BUILD_NUMBER)"
      - name: Profils App Store
        script: xcode-project use-profiles

      - name: Archive IPA SECOTO 1.3 et contrôle bloquant
        script: |
          set -euo pipefail

          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"

          test -f "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" \
            "$PLIST"

          echo "Réglages Xcode Release réellement résolus :"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -showBuildSettings \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            > /tmp/secoto-build-settings.txt

          grep -E \
            "MARKETING_VERSION|CURRENT_PROJECT_VERSION|INFOPLIST_KEY_CFBundleShortVersionString|GENERATE_INFOPLIST_FILE" \
            /tmp/secoto-build-settings.txt

          RESOLVED_VERSION=$(
            awk -F ' = ' \
              '/^[[:space:]]*MARKETING_VERSION = / {
                print $2;
                exit
              }' \
              /tmp/secoto-build-settings.txt
          )

          RESOLVED_BUILD=$(
            awk -F ' = ' \
              '/^[[:space:]]*CURRENT_PROJECT_VERSION = / {
                print $2;
                exit
              }' \
              /tmp/secoto-build-settings.txt
          )

          if [ "$RESOLVED_VERSION" != "$IOS_MARKETING_VERSION" ]; then
            echo "ERREUR : Xcode prépare la version $RESOLVED_VERSION au lieu de $IOS_MARKETING_VERSION"
            exit 1
          fi

          if [ "$RESOLVED_BUILD" != "$IOS_BUILD_NUMBER" ]; then
            echo "ERREUR : Xcode prépare le build $RESOLVED_BUILD au lieu de $IOS_BUILD_NUMBER"
            exit 1
          fi

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "MARKETING_VERSION=$IOS_MARKETING_VERSION CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER"

          IPA_PATH=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -type f -print -quit)

          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "ERREUR : aucune IPA trouvée."
            exit 1
          fi

          CHECK_DIR="/tmp/secoto-final-ipa"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q "$IPA_PATH" -d "$CHECK_DIR"

          APP_DIR=$(find "$CHECK_DIR/Payload" -maxdepth 1 -name "*.app" -type d -print -quit)
          APP_PLIST="$APP_DIR/Info.plist"

          if [ ! -f "$APP_PLIST" ]; then
            echo "ERREUR : Info.plist absent de l’IPA."
            exit 1
          fi

          IPA_VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PLIST"
          )

          IPA_BUILD=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PLIST"
          )

          echo "======================================="
          echo "IPA FINALE SECOTO : $IPA_VERSION ($IPA_BUILD)"
          echo "======================================="

          if [ "$IPA_VERSION" != "$IOS_MARKETING_VERSION" ]; then
            echo "ERREUR BLOQUANTE : l’IPA contient $IPA_VERSION au lieu de $IOS_MARKETING_VERSION."
            exit 1
          fi

          if [ "$IPA_BUILD" != "$IOS_BUILD_NUMBER" ]; then
            echo "ERREUR BLOQUANTE : l’IPA contient le build $IPA_BUILD au lieu de $IOS_BUILD_NUMBER."
            exit 1
          fi

          echo "IPA SECOTO validée pour publication."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-secoto:
    name: SECOTO Android — API 36 / Play Internal
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - secoto_shared
        - secoto_android
      android_signing:
        - SECOTO_RELEASE_KEYSTORE
      vars:
        SECOTO_ANDROID_VERSION_NAME: "1.0"
      node: 24
      java: 21
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Dépendances reproductibles
        script: npm ci
      - name: Verify SECOTO configuration
        script: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$VITE_SECOTO_FUNCTIONS_BASE_URL"

          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL invalid"; exit 1 ;;
          esac

          case "$VITE_SUPABASE_ANON_KEY" in
            sb_publishable_*|eyJ*) ;;
            *) echo "VITE_SUPABASE_ANON_KEY invalid"; exit 1 ;;
          esac

          case "$VITE_SECOTO_FUNCTIONS_BASE_URL" in
            https://*/.netlify/functions) ;;
            *) echo "VITE_SECOTO_FUNCTIONS_BASE_URL invalid"; exit 1 ;;
          esac

      - name: Lint, tests et build Web
        script: |
          npm run lint
          npm test
          npm run build
      - name: Injecter la configuration cliente Firebase
        script: |
          test -n "$FIREBASE_ANDROID_CONFIG_B64"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > android/app/google-services.json
      - name: Son de notification natif — génération et contrôle Android
        script: |
          cp android/app/src/main/res/raw/secoto_cash_register.wav /tmp/secoto_sound_committed.wav
          npm run sounds
          cmp /tmp/secoto_sound_committed.wav android/app/src/main/res/raw/secoto_cash_register.wav

          # res/raw n'accepte que minuscules, chiffres et underscores : un nom
          # invalide fait échouer aapt2 très loin dans le build Gradle.
          ls android/app/src/main/res/raw/ | grep -Eq '^secoto_cash_register\.wav$'
      - name: Synchronisation Capacitor Android
        script: |
          npx cap sync android
          test -f android/app/src/main/res/raw/secoto_cash_register.wav
      - name: Tests, lint et APK debug
        script: |
          cd android
          ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: AAB Release signé
        script: |
          cd android
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          ./gradlew bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/**/*
