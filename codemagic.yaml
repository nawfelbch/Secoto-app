workflows:
  ios-secoto:
    name: SECOTO iOS — Xcode 26 / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SECOTO_ASC
    environment:
      groups:
        - secoto_shared
        - secoto_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.secototransport.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 24
      xcode: 26.0
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Dépendances reproductibles
        script: npm ci
      - name: Lint, tests et build Web
        script: |
          npm run lint
          npm test
          npm run build
      - name: Synchronisation Capacitor iOS (Swift Package Manager)
        script: |
          npx cap sync ios
          test -f "$XCODE_PROJECT/project.pbxproj"
          test ! -f ios/App/Podfile
          test -f ios/App/App/PrivacyInfo.xcprivacy
          test -f ios/App/App/App.entitlements
      - name: Résolution Swift Package Manager
        script: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Compilation simulateur sans signature
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Profils App Store
        script: xcode-project use-profiles
      - name: Archive et IPA Release
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-secoto:
    name: SECOTO Android — API 36 / Play Internal
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - secoto_shared
        - secoto_android
      android_signing:
        - SECOTO_RELEASE_KEYSTORE
      vars:
        SECOTO_ANDROID_VERSION_NAME: "1.0"
      node: 24
      java: 21
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Dépendances reproductibles
        script: npm ci
      - name: Lint, tests et build Web
        script: |
          npm run lint
          npm test
          npm run build
      - name: Injecter la configuration cliente Firebase
        script: |
          test -n "$FIREBASE_ANDROID_CONFIG_B64"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > android/app/google-services.json
      - name: Synchronisation Capacitor Android
        script: npx cap sync android
      - name: Tests, lint et APK debug
        script: |
          cd android
          ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: AAB Release signé
        script: |
          cd android
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          ./gradlew bundleRelease
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/**/*
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
