[build]
  command = "npm run build"
  publish = "dist"
  # Crédits Netlify : chaque déploiement de production coûte 15 crédits. Un
  # commit qui ne touche ni le site ni les fonctions (versions iOS/Android,
  # migrations SQL, tests, documents) n'est pas redéployé. Toujours déployé :
  # premier build, même commit relancé à la main, référence inconnue.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- src public netlify netlify.toml package.json package-lock.json .npmrc index.html vite.config.js"

# Ces variables sont PUBLIQUES par conception (URL Supabase + cle anon protegee
# par les RLS + cle VAPID publique) : elles doivent apparaitre dans le bundle
# client. On les exclut du scanner de secrets Netlify. Ne JAMAIS ajouter ici une
# vraie cle secrete (SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY).
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_VAPID_PUBLIC_KEY,SUPABASE_URL,VITE_APPLE_PAY_MERCHANT_ID,VITE_SECOTO_FUNCTIONS_BASE_URL,VITE_MAP_TILE_URL,VITE_MAP_ATTRIBUTION"

# File de reprise : les notifications partent déjà en direct, ceci rattrape les échecs.
[functions."retry-push-outbox"]
  schedule = "*/2 * * * *"

# Migration 030 : devis, verrous de capture expirés, libérations et
# remboursements des commandes à la demande, suspension des abonnements.
[functions."od-maintenance"]
  schedule = "* * * * *"

# Migration 032 : heure estimée d'arrivée des missions suivies en direct et
# purge horaire des positions devenues inutiles.
[functions."live-eta"]
  schedule = "*/5 * * * *"

[functions."retry-account-deletions"]
  schedule = "17 * * * *"

# Doublon e-mail des evenements critiques (paiement, annulation) : support
# durable exige par la confirmation de commande et la renonciation au droit de
# retractation. La notification push ne suffit pas.
[functions."send-transactional-email"]
  schedule = "*/2 * * * *"

# Remboursement integral de la commission lorsque le TRANSPORTEUR se desiste.
# Une annulation par le client ne cree jamais de ligne a rembourser.
[functions."retry-refunds"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/suppression-compte"
  to = "/suppression-compte.html"
  status = 301

[[redirects]]
  from = "/politique-confidentialite"
  to = "/politique-confidentialite.html"
  status = 301

# Lien de paiement court envoyé par SMS : /payer?t=… sert la fonction devis-pay.
[[redirects]]
  from = "/payer"
  to = "/.netlify/functions/devis-pay"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Référencement : l'app n'est jamais indexée (le site vitrine secoto-transport.fr
# porte le contenu public). Complète la balise robots de index.html.
#
# En-têtes de sécurité (22/10/2026). Choisis pour ne rien bloquer du parcours
# client (paiement Stripe / Apple Pay, liens /payer et /m/{token}, suivi,
# publicités consenties) :
# - HSTS : le navigateur refuse tout retour en HTTP (sans includeSubDomains,
#   pour ne pas toucher aux autres sous-domaines).
# - nosniff : le navigateur n'interprète pas un fichier autrement que son type.
# - X-Frame-Options : l'app ne peut pas être affichée dans le cadre d'un autre
#   site (anti-clickjacking sur les pages de paiement). Aucun site de SECOTO
#   n'intègre l'app dans une iframe ; les aperçus de documents sont des iframes
#   internes de même origine.
# - Referrer-Policy : les liens à jeton (/payer?t=, /m/…) ne fuient jamais en
#   entier vers GTM, Meta, Geoapify, etc.
# - Permissions-Policy : coupe micro, USB, série et Bluetooth, jamais utilisés
#   par l'app. Caméra, géolocalisation et paiement restent autorisés.
# - CSP en MODE RAPPORT SEULEMENT (Content-Security-Policy-Report-Only) : elle
#   ne bloque rien. Elle liste dans la console du navigateur ce qui sortirait
#   de la liste, pour la resserrer puis la passer en blocage sans risque.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(), usb=(), serial=(), bluetooth=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com https://connect.facebook.net https://pay.google.com https://applepay.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://api-adresse.data.gouv.fr https://api.geoapify.com https://router.project-osrm.org https://*.tile.openstreetmap.org https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com https://www.google.com https://www.googleadservices.com https://stats.g.doubleclick.net https://www.facebook.com https://connect.facebook.net; frame-src 'self' blob: https://js.stripe.com https://hooks.stripe.com https://www.googletagmanager.com https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
